<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@700;800&family=Cormorant+Garamond:ital,wght@1,500&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet" />
<style>
  html, body { margin: 0; background: #0f0f11; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1600" height="1000"></canvas>
<script>
// Deterministic, code-rendered motion piece: every frame is a pure function of
// its index (no carried state, seeded randomness), so it loops seamlessly.
const W = 1600, H = 1000, FPS = 30, SECONDS = 8, TOTAL = FPS * SECONDS
const N = 8800
const cv = document.getElementById('c')
const ctx = cv.getContext('2d')
const glow = document.createElement('canvas'); glow.width = W / 2; glow.height = H / 2
const gctx = glow.getContext('2d')

function mulberry(a) { return () => { a |= 0; a = a + 0x6d2b79f5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
const rnd = mulberry(20260924)

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
const map = (t, a, b) => clamp((t - a) / (b - a))
const expoOut = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x))
const expoInOut = (x) => x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2
const cubicInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2)
const quartOut = (x) => 1 - Math.pow(1 - x, 4)
const lerp = (a, b, t) => a + (b - a) * t

let targets = []
let P = []

function buildTargets() {
  const off = document.createElement('canvas'); off.width = W; off.height = H
  const o = off.getContext('2d')
  o.fillStyle = '#fff'
  o.textAlign = 'center'; o.textBaseline = 'alphabetic'
  o.font = '800 330px "Barlow Semi Condensed"'
  o.fillText('MOTION', W / 2, H / 2 + 105)
  const data = o.getImageData(0, 0, W, H).data
  const pts = []
  for (let y = 0; y < H; y += 3) for (let x = 0; x < W; x += 3) if (data[(y * W + x) * 4 + 3] > 128) pts.push([x, y])
  for (let i = pts.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [pts[i], pts[j]] = [pts[j], pts[i]] }
  for (let i = 0; i < N; i++) targets.push(pts[i % pts.length])
}

function buildParticles() {
  const cx = W / 2, cy = H / 2
  for (let i = 0; i < N; i++) {
    const a = rnd() * Math.PI * 2
    const band = Math.pow(rnd(), 1.6)
    P.push({
      a,
      r: 150 + band * 95 + (rnd() - 0.5) * 10,
      turns: 1 + Math.floor(rnd() * 2),
      burst: 260 + Math.pow(rnd(), 0.7) * 620,
      spin: (rnd() - 0.5) * 1.4,
      ph1: rnd() * Math.PI * 2, ph2: rnd() * Math.PI * 2, f1: 1 + Math.floor(rnd() * 3), f2: 1 + Math.floor(rnd() * 3),
      amp: 18 + rnd() * 46,
      size: 0.7 + Math.pow(rnd(), 3) * 2.1,
      heat: rnd(),
      tx: targets[i][0] + (rnd() - 0.5) * 2.2, ty: targets[i][1] + (rnd() - 0.5) * 2.2,
      delay: 0,
      cx, cy,
    })
  }
  for (const p of P) p.delay = (p.tx - 250) / (W - 500) * 0.55 + rnd() * 0.12
}

function pos(p, t) {
  const u = t / SECONDS
  const ang = p.a + u * Math.PI * 2 * p.turns
  const rr = p.r * (1 + 0.035 * Math.sin(u * Math.PI * 2 * 2 + p.ph1))
  const ringX = p.cx + Math.cos(ang) * rr, ringY = p.cy + Math.sin(ang) * rr * 0.98
  const bAng = ang + p.spin
  const burstX = p.cx + Math.cos(bAng) * (rr + p.burst), burstY = p.cy + Math.sin(bAng) * (rr + p.burst) * 0.78
  const dx = Math.sin(u * Math.PI * 2 * p.f1 + p.ph1) * p.amp + Math.sin(u * Math.PI * 2 * 3 + p.ph2 + p.ty * 0.01) * p.amp * 0.4
  const dy = Math.cos(u * Math.PI * 2 * p.f2 + p.ph2) * p.amp + Math.cos(u * Math.PI * 2 * 2 + p.ph1 + p.tx * 0.01) * p.amp * 0.4
  const txX = p.tx + Math.sin(u * Math.PI * 2 * 4 + p.ph1) * 1.1, txY = p.ty + Math.cos(u * Math.PI * 2 * 3 + p.ph2) * 1.1

  const e1 = expoOut(map(t, 1.2, 2.5))
  const e2 = cubicInOut(map(t, 2.35 + p.delay, 4.25 + p.delay))
  const e3 = expoInOut(map(t, 6.15 + p.delay * 0.5, 7.85 + p.delay * 0.2))
  let x = lerp(ringX, burstX + dx, e1), y = lerp(ringY, burstY + dy, e1)
  x = lerp(x, txX, e2); y = lerp(y, txY, e2)
  x = lerp(x, ringX, e3); y = lerp(y, ringY, e3)
  const energy = e1 * (1 - e2) + e2 * (1 - e3) * 0.25 + (1 - e1) * 0.35 + e3 * 0.35
  return [x, y, energy, e2 * (1 - e3)]
}

function colorFor(heat, energy) {
  const k = clamp(heat * 0.5 + energy * 0.3)
  const r = Math.round(lerp(199, 255, k)), g = Math.round(lerp(110, 226, Math.pow(k, 1.4))), b = Math.round(lerp(52, 190, Math.pow(k, 2.2)))
  return `rgb(${r},${g},${b})`
}

function hud(f, t) {
  ctx.save()
  ctx.font = '500 15px "JetBrains Mono"'
  ctx.fillStyle = 'rgba(232,230,225,0.55)'
  ctx.textBaseline = 'top'
  ctx.fillText('FRAME ' + String(f).padStart(4, '0') + ' / ' + TOTAL, 56, 52)
  ctx.textAlign = 'right'
  ctx.fillText('t = ' + t.toFixed(2) + 's', W - 56, 52)
  const phase = t < 1.2 ? 'orbit()' : t < 2.5 ? 'burst · expo.out' : t < 5.2 ? 'assemble · cubic.inOut' : t < 6.15 ? 'hold' : 'return · expo.inOut'
  ctx.fillStyle = 'rgba(199,122,60,0.9)'
  ctx.fillText(phase, W - 56, H - 70)
  ctx.textAlign = 'left'
  ctx.fillStyle = 'rgba(232,230,225,0.55)'
  ctx.fillText(N.toLocaleString('en-US') + ' PARTICLES · 1 FUNCTION OF TIME', 56, H - 70)
  const x0 = 56, x1 = W - 56, yT = H - 40
  ctx.strokeStyle = 'rgba(232,230,225,0.14)'; ctx.lineWidth = 1
  ctx.beginPath(); ctx.moveTo(x0, yT); ctx.lineTo(x1, yT); ctx.stroke()
  for (const k of [1.2, 2.5, 4.25, 6.15, 7.85]) { const x = lerp(x0, x1, k / SECONDS); ctx.beginPath(); ctx.moveTo(x, yT - 5); ctx.lineTo(x, yT + 5); ctx.stroke() }
  const xp = lerp(x0, x1, t / SECONDS)
  ctx.strokeStyle = 'rgba(199,122,60,1)'; ctx.lineWidth = 2
  ctx.beginPath(); ctx.moveTo(x0, yT); ctx.lineTo(xp, yT); ctx.stroke()
  ctx.fillStyle = '#ffd9a8'; ctx.beginPath(); ctx.arc(xp, yT, 3.5, 0, Math.PI * 2); ctx.fill()
  ctx.strokeStyle = 'rgba(199,122,60,0.55)'; ctx.lineWidth = 1.5
  const b = 28, m = 30
  ;[[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([x, y, sx, sy]) => { ctx.beginPath(); ctx.moveTo(x + sx * b, y); ctx.lineTo(x, y); ctx.lineTo(x, y + sy * b); ctx.stroke() })
  ctx.restore()
}

function caption(t) {
  const a = quartOut(map(t, 4.0, 4.9)) * (1 - cubicInOut(map(t, 6.0, 6.6)))
  if (a <= 0) return
  ctx.save()
  ctx.globalAlpha = a
  ctx.textAlign = 'center'
  ctx.font = 'italic 500 44px "Cormorant Garamond"'
  ctx.fillStyle = '#e8e6e1'
  ctx.fillText('written in code', W / 2, H / 2 + 190 + (1 - a) * 14)
  ctx.font = '500 13px "JetBrains Mono"'
  ctx.fillStyle = 'rgba(199,122,60,0.95)'
  ctx.fillText('CLAUDE CODE  ·  CANVAS  ·  0 KEYFRAMES', W / 2, H / 2 + 232 + (1 - a) * 14)
  ctx.restore()
}

function grain(f) {
  const g = mulberry(f * 7919 + 17)
  ctx.save()
  ctx.globalAlpha = 0.07
  for (let i = 0; i < 9000; i++) { const v = g() > 0.5 ? 255 : 0; ctx.fillStyle = `rgb(${v},${v},${v})`; ctx.fillRect(g() * W, g() * H, 1.2, 1.2) }
  ctx.restore()
}

window.renderFrame = (f) => {
  const t = (f % TOTAL) / FPS
  ctx.globalCompositeOperation = 'source-over'
  ctx.fillStyle = '#0f0f11'; ctx.fillRect(0, 0, W, H)
  const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 620)
  bg.addColorStop(0, 'rgba(120,62,26,0.26)'); bg.addColorStop(0.45, 'rgba(70,36,16,0.10)'); bg.addColorStop(1, 'rgba(15,15,17,0)')
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H)

  gctx.clearRect(0, 0, glow.width, glow.height)
  ctx.globalCompositeOperation = 'lighter'
  gctx.globalCompositeOperation = 'lighter'
  ctx.lineCap = 'round'
  for (const p of P) {
    const [x, y, energy, formed] = pos(p, t)
    // motion trail: where this particle was ~2 frames ago (closed-form, so still deterministic)
    const [px, py] = pos(p, Math.max(0, t - 2.2 / FPS))
    const c = colorFor(p.heat, energy)
    const s = p.size * (1 + energy * 0.5) * (formed > 0.5 ? 1.05 : 1)
    ctx.strokeStyle = c; ctx.fillStyle = c
    const moved = Math.hypot(x - px, y - py)
    // fast particles spread their light along the streak instead of stacking into a white-out
    ctx.globalAlpha = (0.45 + 0.45 * clamp(energy * 0.6 + formed * 0.8)) * clamp(4 / (moved + 2) + 0.12)
    if (moved > 1.5) {
      ctx.lineWidth = s
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke()
    } else {
      ctx.fillRect(x - s / 2, y - s / 2, s, s)
    }
    gctx.fillStyle = c
    gctx.globalAlpha = 0.32
    gctx.fillRect(x / 2 - s / 2, y / 2 - s / 2, s, s)
  }
  ctx.globalAlpha = 1
  ctx.filter = 'blur(14px)'; ctx.globalAlpha = 0.9; ctx.drawImage(glow, 0, 0, W, H)
  ctx.filter = 'blur(4px)'; ctx.globalAlpha = 0.6; ctx.drawImage(glow, 0, 0, W, H)
  ctx.filter = 'none'; ctx.globalAlpha = 1
  ctx.globalCompositeOperation = 'source-over'

  caption(t)
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95)
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)')
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H)
  hud(f % TOTAL, t)
  // (no baked grain: the site lays its own animated grain over everything, and
  // per-frame noise would triple the file size)
}

window.ready = document.fonts.load('800 330px "Barlow Semi Condensed"').then(() => Promise.all([
  document.fonts.load('italic 500 44px "Cormorant Garamond"'), document.fonts.load('500 15px "JetBrains Mono"'),
])).then(() => { buildTargets(); buildParticles(); window.renderFrame(0); return true })
</script>
</body>
</html>
